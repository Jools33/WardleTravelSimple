<!doctype html>
<html lang="en-GB" class="locked">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Contact us | Wardle Travel</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css?v=5" />
    <script src="assets/site.js?v=5"></script>
  </head>
  <body>
    <div id="gate"></div>

    <div id="app">
      <div id="site-header"></div>

      <main>
        <section class="page-hero">
          <div class="container">
            <div class="crumbs"><a href="index.html">Home</a> / Contact us</div>
            <h1>Contact us</h1>
            <p>Placeholder copy. Book in store at our branch below, give us a call or send us a message.</p>
          </div>
        </section>
        <section class="section">
          <div class="container">
            <div class="grid cols-2" style="align-items:start">
              <div data-branch></div>
              <div class="card">
                <h3>Opening hours</h3>
                <div data-hours></div>
              </div>
            </div>
            <div class="card" style="margin-top:1.25rem;padding:0;overflow:hidden">
              <div class="ph map-ph" style="margin:0;border-radius:0">📍</div>
            </div>
          </div>
        </section>

        <section class="section section-white" id="enquiry">
          <div class="container" style="max-width:760px">
            <div class="section-head center">
              <span class="kicker">Enquiries</span>
              <h2>Got a question?</h2>
              <p>Send us a message and one of the team will get back to you.</p>
            </div>
            <form class="card" data-demo-form="Thanks! In the real site this message would be sent to the Wardle Travel team. This form is a placeholder.">
              <div class="grid-2">
                <div class="field"><label for="c-name">Name</label><input id="c-name" required /></div>
                <div class="field"><label for="c-phone">Phone</label><input id="c-phone" type="tel" /></div>
              </div>
              <div class="field"><label for="c-email">Email</label><input id="c-email" type="email" required /></div>
              <div class="field"><label for="c-address">Address</label><input id="c-address" /></div>
              <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" rows="5"></textarea></div>
              <button class="btn btn-primary btn-block">Send</button>
              <p class="note">This form is a placeholder and doesn't send anything.</p>
            </form>
          </div>
        </section>
      </main>

      <div id="site-footer"></div>
    </div>
  </body>
</html>
